name: Evaluador Inteligente de TFM

on:
  push:
    branches: [ "main" ] # Se ejecuta automáticamente cuando subes cambios a main
  workflow_dispatch:     # Activa el botón azul en GitHub para ejecutarlo manualmente cuando quieras
  schedule:
    # Se ejecutará automáticamente todos los días a las 07:00 UTC 
    # (Equivale a las 09:00 AM en horario de verano en España)
    - cron: '0 7 * * *'

jobs:
  auditar-equipo:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga el repositorio inyectando la historia completa de Git (Vital para PyDriller)
      - name: Checkout del codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          
      # 2. Invoca tu acción Docker pasando de forma explícita el secreto cifrado de la API
      - name: Analizar Contribuciones con IA
        uses: ./ 
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
      # 3. Empaqueta el archivo persistido generado por Python como un artefacto zip descargable
      - name: Subir informe al repositorio
        uses: actions/upload-artifact@v4
        with:
          name: informe-supervisor
          path: INFORME_SUPERVISOR.md